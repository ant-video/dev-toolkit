[package]
name = "dev-toolkit"
version = "1.0.0"
description = "程序员常用工具集"
authors = ["leospring"]
edition = "2021"

[lib]
name = "dev_toolkit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
digest = "0.10"
hmac = "0.12"
hex = "0.4"
base64 = "0.22"
url = "2"
aes-gcm = "0.10"

regex = "1"
urlencoding = "2"
jwt = "0.16"
