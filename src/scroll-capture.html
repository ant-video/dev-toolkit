<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滚动截图</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* === 阶段1: 区域选择 === */
        #region-select-phase {
            position: fixed; inset: 0;
            z-index: 1000;
            cursor: crosshair;
        }
        #region-select-phase img {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            user-select: none;
            -webkit-user-drag: none;
        }
        #region-overlay {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.5);
        }
        #region-box {
            position: absolute;
            border: 2px dashed #4fc3f7;
            background: rgba(79, 195, 247, 0.1);
            display: none;
            pointer-events: none;
        }
        #region-info {
            position: absolute;
            background: rgba(0,0,0,0.8);
            color: #4fc3f7;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 3px;
            display: none;
            pointer-events: none;
            white-space: nowrap;
        }
        #region-hint {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            color: #fff;
            font-size: 18px;
            padding: 20px 40px;
            border-radius: 12px;
            pointer-events: none;
            text-align: center;
            transition: opacity 0.3s;
        }
        #region-hint .sub { font-size: 13px; color: #aaa; margin-top: 8px; }

        /* === 阶段2: 滚动捕获 === */
        #capture-phase {
            display: none;
            height: 100vh;
            flex-direction: column;
        }
        .toolbar {
            background: #16213e;
            border-bottom: 1px solid #2a2a4a;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .toolbar .status {
            font-size: 14px;
            color: #4fc3f7;
            flex: 1;
        }
        .toolbar .status .count { color: #66bb6a; font-weight: bold; }
        .toolbar .status .height { color: #ffa726; }

        .btn {
            padding: 6px 16px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 500;
        }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: #4fc3f7; color: #1a1a2e; }
        .btn-primary:hover { background: #29b6f6; }
        .btn-success { background: #66bb6a; color: #1a1a2e; }
        .btn-success:hover { background: #81c784; }
        .btn-danger { background: #ef5350; color: #fff; }
        .btn-danger:hover { background: #f44336; }
        .btn-warning { background: #ffa726; color: #1a1a2e; }
        .btn-warning:hover { background: #ffb74d; }

        .preview-area {
            flex: 1;
            overflow: auto;
            background: #111;
            display: flex;
            justify-content: center;
            padding: 20px;
        }
        .preview-area img {
            max-width: 100%;
            border: 1px solid #333;
            border-radius: 4px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .capture-controls {
            background: #16213e;
            border-top: 1px solid #2a2a4a;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .capture-controls .hint {
            font-size: 12px;
            color: #888;
            flex: 1;
        }

        /* 滚动指示器 */
        .scroll-indicator {
            position: fixed;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .scroll-indicator.active { opacity: 1; }
        .scroll-indicator .arrow {
            font-size: 28px;
            color: #4fc3f7;
            animation: bounce 1.5s infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(8px); }
        }
        .scroll-indicator .label {
            font-size: 11px;
            color: #aaa;
            writing-mode: vertical-rl;
        }

        /* Toast 通知 */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-80px);
            background: rgba(0,0,0,0.9);
            color: #fff;
            padding: 10px 24px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 2000;
            transition: transform 0.3s;
            pointer-events: none;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
        .toast.error { border-left: 3px solid #ef5350; }
        .toast.success { border-left: 3px solid #66bb6a; }
        .toast.info { border-left: 3px solid #4fc3f7; }
    </style>
</head>
<body>

<!-- 阶段1: 区域选择 -->
<div id="region-select-phase" style="display:none;">
    <img id="fullscreen-img" src="" alt="全屏截图">
    <div id="region-overlay"></div>
    <div id="region-box"></div>
    <div id="region-info"></div>
    <div id="region-hint">
        拖拽选择要截取的滚动区域
        <div class="sub">按 Esc 取消</div>
    </div>
</div>

<!-- 阶段2: 滚动捕获 -->
<div id="capture-phase">
    <div class="toolbar">
        <div class="status">
            📸 滚动截图进行中 · 已采集 <span class="count" id="capture-count">1</span> 帧
            · 合成高度 <span class="height" id="composite-height">0</span>px
        </div>
        <button class="btn btn-warning" id="btn-manual-capture">手动截取</button>
        <button class="btn btn-primary" id="btn-finish">✓ 完成</button>
        <button class="btn btn-danger" id="btn-cancel">✕ 取消</button>
    </div>
    <div class="preview-area">
        <img id="preview-img" src="" alt="拼接预览">
    </div>
    <div class="capture-controls">
        <span class="hint">
            💡 切换到要截取的窗口，滚动内容后点击"手动截取"，或等待自动采集（每1.5秒）
        </span>
        <label style="font-size:12px; color:#888; display:flex; align-items:center; gap:4px;">
            <input type="checkbox" id="auto-capture" checked> 自动采集
        </label>
    </div>
</div>

<!-- 滚动指示器 -->
<div class="scroll-indicator" id="scroll-indicator">
    <div class="arrow">⬇</div>
    <div class="label">请向下滚动</div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
    const { invoke } = window.__TAURI__.core;

    // === 全局状态 ===
    let fullscreenImgWidth = 0;
    let fullscreenImgHeight = 0;
    let regionX = 0, regionY = 0, regionW = 0, regionH = 0;
    let autoCaptureTimer = null;
    let isCapturing = false;

    // === Toast ===
    function showToast(msg, type = 'info', duration = 2500) {
        const el = document.getElementById('toast');
        el.textContent = msg;
        el.className = 'toast ' + type + ' show';
        setTimeout(() => el.className = 'toast', duration);
    }

    // === 阶段1: 区域选择 ===
    async function startRegionSelect() {
        try {
            const result = await invoke('scroll_capture_start');
            if (!result.success) {
                showToast(result.error || '截图失败', 'error');
                setTimeout(() => invoke('scroll_capture_cancel'), 1500);
                return;
            }
            fullscreenImgWidth = result.width;
            fullscreenImgHeight = result.height;

            const img = document.getElementById('fullscreen-img');
            img.src = result.image_data;
            img.onload = () => {
                document.getElementById('region-select-phase').style.display = 'block';
            };
        } catch (e) {
            showToast('启动失败: ' + e, 'error');
            setTimeout(() => invoke('scroll_capture_cancel'), 1500);
        }
    }

    // 区域选择拖拽
    let selStartX = 0, selStartY = 0, selDragging = false;
    const regionPhase = document.getElementById('region-select-phase');
    const regionBox = document.getElementById('region-box');
    const regionInfo = document.getElementById('region-info');
    const regionHint = document.getElementById('region-hint');

    regionPhase.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        selDragging = true;
        selStartX = e.clientX;
        selStartY = e.clientY;
        regionBox.style.display = 'block';
        regionBox.style.left = selStartX + 'px';
        regionBox.style.top = selStartY + 'px';
        regionBox.style.width = '0px';
        regionBox.style.height = '0px';
        regionHint.style.opacity = '0';
        e.preventDefault();
    });

    regionPhase.addEventListener('mousemove', (e) => {
        if (!selDragging) return;
        const x = Math.min(selStartX, e.clientX);
        const y = Math.min(selStartY, e.clientY);
        const w = Math.abs(e.clientX - selStartX);
        const h = Math.abs(e.clientY - selStartY);
        regionBox.style.left = x + 'px';
        regionBox.style.top = y + 'px';
        regionBox.style.width = w + 'px';
        regionBox.style.height = h + 'px';

        // 计算实际像素坐标
        const scaleX = fullscreenImgWidth / window.innerWidth;
        const scaleY = fullscreenImgHeight / window.innerHeight;
        regionInfo.style.display = 'block';
        regionInfo.style.left = (x + w + 5) + 'px';
        regionInfo.style.top = (y + h + 5) + 'px';
        regionInfo.textContent = `${Math.round(w * scaleX)} × ${Math.round(h * scaleY)}`;
    });

    regionPhase.addEventListener('mouseup', async (e) => {
        if (!selDragging) return;
        selDragging = false;

        const x = Math.min(selStartX, e.clientX);
        const y = Math.min(selStartY, e.clientY);
        const w = Math.abs(e.clientX - selStartX);
        const h = Math.abs(e.clientY - selStartY);

        if (w < 30 || h < 30) {
            regionBox.style.display = 'none';
            regionInfo.style.display = 'none';
            regionHint.style.opacity = '1';
            return;
        }

        // 转换为图片实际像素坐标
        const scaleX = fullscreenImgWidth / window.innerWidth;
        const scaleY = fullscreenImgHeight / window.innerHeight;
        regionX = Math.round(x * scaleX);
        regionY = Math.round(y * scaleY);
        regionW = Math.round(w * scaleX);
        regionH = Math.round(h * scaleY);

        try {
            const result = await invoke('scroll_capture_set_region', {
                x: regionX, y: regionY, w: regionW, h: regionH
            });
            if (!result.success) {
                showToast(result.error || '设置区域失败', 'error');
                return;
            }
            // 进入捕获阶段
            enterCapturePhase(result.width, result.height);
        } catch (e) {
            showToast('设置区域失败: ' + e, 'error');
        }
    });

    // === 阶段2: 滚动捕获 ===
    async function enterCapturePhase(w, h) {
        document.getElementById('region-select-phase').style.display = 'none';
        document.getElementById('capture-phase').style.display = 'flex';
        document.getElementById('composite-height').textContent = h;
        document.getElementById('capture-count').textContent = '1';

        // 显示滚动指示器
        const indicator = document.getElementById('scroll-indicator');
        indicator.classList.add('active');
        setTimeout(() => indicator.classList.remove('active'), 5000);

        // 启动自动采集
        startAutoCapture();
    }

    async function doCapture() {
        if (isCapturing) return;
        isCapturing = true;

        try {
            const result = await invoke('scroll_capture_tick');
            if (result.success) {
                document.getElementById('capture-count').textContent = result.capture_count;
                document.getElementById('composite-height').textContent = result.total_height;

                if (result.has_new_content) {
                    showToast(`拼接成功 · 高度 ${result.total_height}px`, 'success', 1500);
                    // 更新预览
                    await updatePreview();
                }
                if (result.error) {
                    showToast(result.error, 'info', 3000);
                }
            } else if (result.error) {
                showToast(result.error, 'error', 2000);
            }
        } catch (e) {
            // 静默忽略采集错误
        }
        isCapturing = false;
    }

    async function updatePreview() {
        try {
            const result = await invoke('scroll_capture_finish');
            if (result.success) {
                document.getElementById('preview-img').src = result.image_data;
            }
        } catch (e) {
            // 预览更新失败不影响主流程
        }
    }

    function startAutoCapture() {
        stopAutoCapture();
        const checkbox = document.getElementById('auto-capture');
        if (!checkbox.checked) return;
        autoCaptureTimer = setInterval(doCapture, 1500);
    }

    function stopAutoCapture() {
        if (autoCaptureTimer) {
            clearInterval(autoCaptureTimer);
            autoCaptureTimer = null;
        }
    }

    document.getElementById('auto-capture').addEventListener('change', (e) => {
        if (e.target.checked) startAutoCapture();
        else stopAutoCapture();
    });

    document.getElementById('btn-manual-capture').addEventListener('click', doCapture);

    document.getElementById('btn-finish').addEventListener('click', async () => {
        stopAutoCapture();
        try {
            const result = await invoke('scroll_capture_finish');
            if (result.success) {
                // 打开编辑器处理最终图片
                await openEditorWithImage(result.image_data, result.width, result.height, result.capture_count);
            } else {
                showToast(result.error || '完成失败', 'error');
            }
        } catch (e) {
            showToast('完成失败: ' + e, 'error');
        }
    });

    document.getElementById('btn-cancel').addEventListener('click', async () => {
        stopAutoCapture();
        try {
            await invoke('scroll_capture_cancel');
        } catch (e) {}
        window.close();
    });

    // === 打开截图编辑器 ===
    async function openEditorWithImage(imageData, w, h, count) {
        try {
            // 将图片数据存到 ScreenshotState，然后打开编辑器窗口
            await invoke('set_screenshot_data', { data: imageData });
            await invoke('open_screenshot_editor', {
                label: 'scroll-result-' + Date.now(),
                title: `滚动截图 (${count}帧, ${w}×${h})`
            });
            window.close();
        } catch (e) {
            // 如果编辑器不可用，直接保存
            showToast('正在打开保存对话框...', 'info');
            try {
                const result = await invoke('save_screenshot_file', { imageBase64: imageData });
                if (result.success) {
                    showToast('已保存: ' + result.path, 'success', 3000);
                }
            } catch (e2) {
                showToast('保存失败: ' + e2, 'error');
            }
            window.close();
        }
    }

    // === Esc 取消 ===
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
            stopAutoCapture();
            invoke('scroll_capture_cancel').catch(() => {});
            window.close();
        }
    });

    // === 启动 ===
    startRegionSelect();
</script>
</body>
</html>
